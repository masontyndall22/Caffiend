name = "kyle-energy-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Comma-separated sites allowed to call the API. Add your GitHub Pages origin before deploying.
[vars]
ALLOWED_ORIGINS = "https://masontyndall22.github.io/Caffiend/"
VAPID_SUBJECT = "https://github.com/"   # a URL or mailto: push services can use to reach you

[[d1_databases]]
binding = "DB"
database_name = "kyle-energy"
database_id = "5432a588-2bf9-464c-8834-9a95afde815b"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   CREW_PIN           PIN the app asks for before saving
#   VAPID_PUBLIC_KEY   from gen-vapid.mjs (also goes in js/config.js, it's public)
#   VAPID_PRIVATE_KEY  from gen-vapid.mjs (secret)
